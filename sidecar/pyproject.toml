[project]
name = "hearbook-sidecar"
version = "0.1.0"
description = "HearBook/Enisma offline inference sidecar (FastAPI over loopback)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # English TTS: Kokoro weights run on onnxruntime; espeakng-loader ships the
    # espeak-ng shared library AND its data inside the wheel, so nothing has to
    # be collected by hand. misaki is deliberately NOT used — it pulls spacy and
    # torch for a G2P quality difference we have not measured.
    "onnxruntime>=1.20.1",
    "espeakng-loader>=0.2.4",
    "phonemizer>=3.4.0",
    # Ge'ez-language TTS: MMS VITS models, with uroman romanizing Ge'ez to the
    # Latin alphabet the models' symbol tables actually contain.
    "sherpa-onnx>=1.13.2",
    "uroman>=1.3.1.1",
    # Number-to-words. TEMPORARY git pin: stock num2words2 returns Tigrigna in
    # its own Latin transliteration, which collides with uroman's romanization
    # of the surrounding words and produces audio a native speaker cannot
    # follow. Fixed in this fork; a PR is open upstream. Revisit ~2026-09-24 —
    # see the risk entry in docs/implementation-plan.md. Pinned by SHA, never
    # by branch. Building this from git needs a Rust toolchain and takes about
    # two minutes on a warm cargo cache.
    "num2words2",
]

[tool.uv.sources]
num2words2 = { git = "https://github.com/hadamard-2/num2words2", rev = "4fea55e128635ed75623e45e49405bafcdd1ace8" }

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "httpx>=0.27",
    "pytest>=8.0",
    "soundfile>=0.12",
]

# This is an application, not a library: don't try to build/install the project
# itself into the venv — just manage its dependencies.
[tool.uv]
package = false

[tool.pytest.ini_options]
# tests/ has no __init__.py, so pytest's default rootdir-insertion only adds
# tests/ itself to sys.path, not sidecar/ where guards.py (and server.py)
# live. Add the sidecar root explicitly so `from guards import ...` resolves.
pythonpath = ["."]
