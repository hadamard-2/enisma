[project]
name = "enisma-sidecar"
version = "0.1.0"
description = "Enisma offline inference sidecar (FastAPI over loopback)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # English TTS: Kokoro weights run on onnxruntime; espeakng-loader ships the
    # espeak-ng shared library AND its data inside the wheel, so nothing has to
    # be collected by hand. misaki is deliberately NOT used — it pulls spacy and
    # torch for a G2P quality difference we have not measured.
    "onnxruntime>=1.20.1",
    "espeakng-loader>=0.2.4",
    "phonemizer>=3.4.0",
    # Ge'ez-language TTS: MMS VITS models, with uroman romanizing Ge'ez to the
    # Latin alphabet the models' symbol tables actually contain.
    "sherpa-onnx>=1.13.2",
    # sherpa-onnx's wheel ships no ONNX Runtime of its own: its compiled
    # extension (_sherpa_onnx*.so) links a bare libonnxruntime.so that nothing
    # else on this list provides. sherpa-onnx-core is the companion package
    # that supplies it (as sherpa_onnx/lib/libonnxruntime.so, separate from
    # onnxruntime's own copy, so the two do not collide). Nothing in our
    # source imports sherpa_onnx_core by name, so it looks unused — it is not;
    # without it `import sherpa_onnx` fails with an ImportError at load time.
    # Pinned to match sherpa-onnx's version: the two ship matched halves of
    # one native library and must not drift apart.
    "sherpa-onnx-core>=1.13.2,<1.14",
    "uroman>=1.3.1.1",
    # Number-to-words. TEMPORARY git pin: the released num2words2 on PyPI
    # (1.0.20) returns Tigrigna in its own Latin transliteration, which
    # collides with uroman's romanization of the surrounding words and
    # produces audio a native speaker cannot follow. Fixed upstream and
    # merged, but not yet released — so the pin tracks upstream main by SHA,
    # never by branch. Drop it for a plain PyPI dependency as soon as a
    # release >= 1.0.21 lands; see the risk entry in
    # docs/implementation-plan.md. Building from git needs a Rust toolchain
    # and takes about two minutes on a warm cargo cache.
    "num2words2",
    # MP3 encoding for export. LGPL-3.0; the wheels bundle LAME and cover
    # every target platform, so nothing is compiled here.
    "lameenc>=1.8.4",
]

[tool.uv.sources]
num2words2 = { git = "https://github.com/gladiaio/num2words2", rev = "b3c82111c33a0a8f52450bfd6a57a0a327f0a02f" }

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "httpx>=0.27",
    "pytest>=8.0",
    "soundfile>=0.12",
]

# This is an application, not a library: don't try to build/install the project
# itself into the venv — just manage its dependencies.
[tool.uv]
package = false

[tool.pytest.ini_options]
# tests/ has no __init__.py, so pytest's default rootdir-insertion only adds
# tests/ itself to sys.path, not sidecar/ where guards.py (and server.py)
# live. Add the sidecar root explicitly so `from guards import ...` resolves.
pythonpath = ["."]
